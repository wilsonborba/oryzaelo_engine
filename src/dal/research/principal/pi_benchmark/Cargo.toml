[package]
name = "v2_six_benchmark"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated latency benchmark for the exact v2 six-class ONNX candidate (rice_stage_six.onnx)"

# Standalone package: not a member of the oryzaelo_engine crate.
[workspace]

[dependencies]
# Same ONNX Runtime binding and features as oryzaelo_engine
ort = { version = "=2.0.0-rc.13", features = ["ndarray", "download-binaries", "tls-native"] }
ndarray = "=0.17.2"
serde_json = "1.0"

[profile.release]
opt-level = 3
