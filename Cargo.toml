[package]
name = "oryzaelo_engine"
version = "0.1.0"
edition = "2021"
authors = ["Wilson Borba <wilson@asodya.com>"]
description = "Oryzaelo-Engine: High-performance edge computing microservice for rice phenological stage classification"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
dotenvy = "0.15"
lazy_static = "1.5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "macros", "chrono"] }
csv = "1.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
ort = { version = "2.0.0-rc.13", features = ["ndarray", "download-binaries", "tls-native"] }
ndarray = "0.17.2"
sysinfo = "0.32"

[[bin]]
name = "oryzaelo_engine"
path = "src/main.rs"

[lib]
name = "oryzaelo_engine"
path = "src/lib.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
